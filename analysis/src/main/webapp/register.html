<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
        }

        .container {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            color: #555;
        }

        .login-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <p class="subtitle">
        Create your student account
    </p>

    <form action="register" method="post">

        <!-- Student Name -->
        <div class="form-group">

            <label for="name">Full Name</label>

            <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
            >

        </div>


        <!-- Email -->
        <div class="form-group">

            <label for="email">Email</label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
            >

        </div>


        <!-- Roll Number -->
        <div class="form-group">

            <label for="regdNo">Registration Number</label>

            <input
                    type="number"
                    id="regdNo"
                    name="regdNo"
                    placeholder="Enter your registration number"
                    required
            >

        </div>


        <!-- Course -->
        <div class="form-group">

            <label for="course">Course</label>

            <input
                    type="text"
                    id="course"
                    name="course"
                    placeholder="Enter your course"
                    required
            >

        </div>


        <!-- Semester -->
        <div class="form-group">

            <label for="semester">Semester</label>

            <select
                    id="semester"
                    name="semester"
                    required
            >

                <option value="">Select Semester</option>

                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>

            </select>

        </div>


        <!-- Password -->
        <div class="form-group">

            <label for="password">Password</label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
            >
            <div class="form-group">

                <label for="mobile_no">Mobile_No</label>

                <input
                        type="number"
                        id="mobile_no"
                        name="mobile_no"
                        placeholder="Enter your mobile no."
                        required
                >

            </div>


        <button type="submit">
            Register
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>

</body>
</html>
